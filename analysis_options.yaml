# LifeLedger analyzer configuration — zero-warning policy (docs/10-coding-standards.md §1).
# CI fails on any analyzer diagnostic (`flutter analyze --fatal-infos`).

include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
    strict-inference: true
  errors:
    todo: warning

linter:
  rules:
    prefer_const_constructors: true
    prefer_const_declarations: true
    prefer_final_locals: true
    prefer_final_in_for_each: true
    avoid_print: true # use AppLogger (docs/03 §5)
    require_trailing_commas: true
    always_declare_return_types: true
    unawaited_futures: true
    avoid_dynamic_calls: true
    use_build_context_synchronously: true
    directives_ordering: true
    public_member_api_docs: true # every public API documented (docs/10 §3, NFR-22)
    avoid_redundant_argument_values: true
    cast_nullable_to_non_nullable: true
    only_throw_errors: true
    prefer_single_quotes: true
    sort_pub_dependencies: true
    unnecessary_lambdas: true
    unnecessary_parenthesis: true
    # Repositories/use cases take named constructor params assigned to
    # private fields (readable DI call sites). Dart has no private named
    # initializing formals, so this lint fights the chosen idiom.
    prefer_initializing_formals: false
